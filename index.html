<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/najodshifo.github.io/">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Najot Shifo appointment app">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Najot Shifo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Najot Shifo brand colors -->
  <meta name="theme-color" content="#1A1D7B">
  <meta name="msapplication-navbutton-color" content="#1A1D7B">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Najot Shifo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #1A1D7B;
      margin: 0;
      height: 100%;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #1A1D7B;
      z-index: 9999;
      pointer-events: none;
    }

    .splash-title {
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin: 0;
    }

    .splash-loader {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #00D4B8;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = '"2421124795" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */';
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-loader" aria-hidden="true"></div>
    <p class="splash-title">NAJOT SHIFO</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
